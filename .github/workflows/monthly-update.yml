name: 월간 실거래 업데이트

on:
  schedule:
    - cron: "0 18 2 * *" # 매월 3일 03:00 (한국시간)
  workflow_dispatch: # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 실거래 수집·좌표 변환
        run: python scripts/build_data.py
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          MONTHS: "6"
      - name: 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/apartments.json data/geocache.json
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date +%Y-%m) 실거래 업데이트"
          git push
